# 把「案头」发布到 GitHub Pages，好让手机能「添加到主屏幕」装成 App。
# 从源码构建而不是直接传仓库里的产物，避免产物过期。
#
# ⚠️ 需要先手动开一次 Pages（只需一次）：
#    仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#    Actions 的 GITHUB_TOKEN 没有创建 Pages 站点的权限，这一步只能由人来点。
#    开完之后这个流水线每次推送自动发布，不用再管。
name: Deploy 案头 to Pages

on:
  push:
    branches:
      - main
      - claude/personal-dashboard-design-jgjmnb
    paths:
      - 'desk/**'
      - '.github/workflows/deploy-desk.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建与校验。跟 Pages 开没开无关，永远该是绿的。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desk/package-lock.json

      - name: 安装依赖
        working-directory: desk
        run: npm ci

      - name: 类型检查
        working-directory: desk
        run: npm run typecheck

      - name: 构建（多文件 + PWA）
        working-directory: desk
        run: npm run build

      - name: 构建单文件版并放进产物
        working-directory: desk
        run: |
          npx vite build --config vite.config.single.ts
          node scripts-postbuild-single.mjs
          cp dist-single/index.html dist/deskside-standalone.html

      - name: 冒烟检查 —— 产物不能是空壳
        working-directory: desk
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -s dist/deskside-standalone.html
          # 单文件版里必须有一段够大的内联脚本，否则就是构建塌了。
          # 这条断言是踩过坑加的：removeViteModuleLoader 曾把入口脚本整个删掉，
          # 产出一个「文件在、页面白」的产物。
          node -e "
            const fs=require('fs');
            const h=fs.readFileSync('dist/deskside-standalone.html','utf8');
            const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1].length);
            const max=Math.max(0,...m);
            if(max<50000){console.error('内联脚本只有 '+max+' 字节，产物是空的');process.exit(1)}
            if(/type=[\"']module[\"']/.test(h)){console.error('单文件版里还有 module 脚本');process.exit(1)}
            console.log('ok，内联脚本 '+(max/1024|0)+'KB');
          "

      # base 用的是相对路径（vite.config.ts 里 base: './'），
      # 所以不需要 actions/configure-pages 去算 URL，直接传产物即可。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desk/dist

  # 部署。只在 main 上跑。
  #
  # github-pages 这个 environment 有分支保护，只接受来自默认分支的部署，
  # 所以在功能分支上这个 job 必然在 1 秒内失败、不产出任何日志。
  # 之前没加这个条件，每个功能分支的 PR 上都挂一个红叉，而它跟改动无关 ——
  # 红色必须意味着「有事」，天天红的检查等于没有检查。
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署失败时给出下一步
        if: failure()
        run: |
          echo "::error::部署失败。先确认 Settings → Pages → Build and deployment →"
          echo "::error::Source 是否为 'GitHub Actions'（这一步只能由人手动点一次，"
          echo "::error::Actions 的 token 没有创建 Pages 站点的权限）。"
          echo "::error::已经开过的话，去上面的 build job 看产物是不是没传上来。"
