# 把「随手拾」发布到 GitHub Pages，好让手机能「添加到主屏幕」装成 App。
# 从源码构建而不是直接传仓库里的产物，避免产物过期。
#
# ⚠️ 需要先手动开一次 Pages（只需一次）：
#    仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#    Actions 的 GITHUB_TOKEN 没有创建 Pages 站点的权限，这一步只能由人来点。
#    开完之后这个流水线每次推送自动发布，不用再管。
name: Deploy 随手拾 to Pages

on:
  push:
    branches:
      - main
      - claude/personal-dashboard-design-jgjmnb
    paths:
      - 'desk/**'
      # 有人直接改了仓库里那份离线版，也要跑一遍比对
      - 'web/desk/**'
      - '.github/workflows/deploy-desk.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建与校验。跟 Pages 开没开无关，永远该是绿的。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desk/package-lock.json

      - name: 安装依赖
        working-directory: desk
        run: npm ci

      - name: 类型检查
        working-directory: desk
        run: npm run typecheck

      - name: 私人照片不许进公开仓库
        # 这个仓库是公开的，删了也还在历史里 —— 所以必须在合进来之前拦。
        # 私人照片一张都不该进 git（这条守的是整个仓库，不只是 desk/）。
        run: node desk/scripts-no-private-photos.mjs
        working-directory: .

      - name: 构建（多文件 + PWA）
        working-directory: desk
        run: npm run build

      - name: 构建单文件版并放进产物
        working-directory: desk
        run: |
          npx vite build --config vite.config.single.ts
          node scripts-postbuild-single.mjs
          cp dist-single/index.html dist/deskside-standalone.html

      - name: 冒烟检查 —— 产物不能是空壳
        working-directory: desk
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -s dist/deskside-standalone.html
          # 单文件版里必须有一段够大的内联脚本，否则就是构建塌了。
          # 这条断言是踩过坑加的：removeViteModuleLoader 曾把入口脚本整个删掉，
          # 产出一个「文件在、页面白」的产物。
          node -e "
            const fs=require('fs');
            const h=fs.readFileSync('dist/deskside-standalone.html','utf8');
            const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1].length);
            const max=Math.max(0,...m);
            if(max<50000){console.error('内联脚本只有 '+max+' 字节，产物是空的');process.exit(1)}
            if(/type=[\"']module[\"']/.test(h)){console.error('单文件版里还有 module 脚本');process.exit(1)}
            console.log('ok，内联脚本 '+(max/1024|0)+'KB');
          "

      # 仓库里签着一份离线单文件版（web/desk/deskside-standalone.html），
      # 给人「下载下来双击就能开」用的。它没有任何东西守着，于是**烂了九个 PR**：
      # 上次更新停在 #30，#31–#39 全没进去 —— 谁拿它打开，看到的还是
      # 「45% 配一根空条」「点关闭把整个 App 弹走」「备份丢日记」那个版本。
      #
      # 一个看起来是最新、其实不是的产物，比没有更糟 —— 跟这个 App 里
      # 已经砍掉的那些假数字是同一个病。所以这里钉死：**它必须跟源码一致。**
      #
      # 这一步在 desk/** 或 web/desk/** 改动时跑（见顶上的 paths）——
      # 前者是让它过期的原因，后者是有人直接动了它。
      - name: 仓库里那份离线版不许过期
        # 注意比的是**提交进仓库的那一份**（git 里的），不是工作区里的文件。
        # 上一版这里写的是 diff 两个文件 —— 而前面那步 postbuild 会把刚构建的产物
        # 顺手写进 web/desk/，于是它拿 CI 自己的产物跟自己比，**永远一致，永远是绿的**。
        # 本地毒化能抓到（本地是先构建、再把旧版塞回去），CI 里从来没真正检查过。
        #
        # 这也是单文件版的版本戳为什么是固定的（vite.config.single.ts）：
        # 印了构建时间的话，两次构建永远不一样，这条就永远是红的。
        run: |
          if ! git diff --quiet -- web/desk/deskside-standalone.html; then
            echo "::error::web/desk/deskside-standalone.html 跟源码对不上了。"
            echo ""
            echo "这份文件是签进仓库、给人下载下来离线打开的。源码变了它没变，"
            echo "别人打开看到的就是旧版本。跑这一条，然后把它一起提交："
            echo ""
            echo "    cd desk && npx vite build --config vite.config.single.ts && node scripts-postbuild-single.mjs"
            echo ""
            git diff --stat -- web/desk/deskside-standalone.html || true
            exit 1
          fi
          if ! cmp -s desk/dist/deskside-standalone.html web/desk/deskside-standalone.html; then
            echo "::error::放进 Pages 的那份和仓库里那份不是同一个文件 —— 构建步骤的拷贝坏了"
            exit 1
          fi
          echo "ok，仓库里那份跟源码一致"

      # base 用的是相对路径（vite.config.ts 里 base: './'），
      # 所以不需要 actions/configure-pages 去算 URL，直接传产物即可。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desk/dist

  # 部署。只在 main 上跑。
  #
  # github-pages 这个 environment 有分支保护，只接受来自默认分支的部署，
  # 所以在功能分支上这个 job 必然在 1 秒内失败、不产出任何日志。
  # 之前没加这个条件，每个功能分支的 PR 上都挂一个红叉，而它跟改动无关 ——
  # 红色必须意味着「有事」，天天红的检查等于没有检查。
  # 行为测试。以前这一整套只活在一次会话的临时目录里 ——
  # 也就是说「全绿」除了那次会话谁都复现不了。搬进仓库之后它得真的挡住合并。
  test:
    runs-on: ubuntu-latest
    # 兜底的兜底。run-all.sh 里每条套件已经有 180 秒上限，
    # 但万一是 runner 本身或 npm 卡住，那个上限管不到 ——
    # 而没有这一行的话，一次挂死会一路烧到 GitHub 的 6 小时上限。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desk/package-lock.json

      - name: 安装依赖
        working-directory: desk
        run: npm ci

      # playwright 的版本在 package.json 里钉死了，必须跟这里装的浏览器对上
      - name: 装浏览器
        working-directory: desk
        run: npx playwright install --with-deps chromium

      - name: 跑全套（7 个套件）
        working-directory: desk
        run: npm test
        env:
          # 本机最慢的一条也就几十秒；给到 180 秒，卡住的会被单独标出来，
          # 而不是把整个 job 拖死
          SUITE_TIMEOUT: '180'

      - name: 失败时把截图捞出来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 出问题时的截图
          path: desk/test/shots/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署失败时给出下一步
        if: failure()
        run: |
          echo "::error::部署失败。先确认 Settings → Pages → Build and deployment →"
          echo "::error::Source 是否为 'GitHub Actions'（这一步只能由人手动点一次，"
          echo "::error::Actions 的 token 没有创建 Pages 站点的权限）。"
          echo "::error::已经开过的话，去上面的 build job 看产物是不是没传上来。"
